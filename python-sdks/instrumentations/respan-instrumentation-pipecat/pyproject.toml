[tool.poetry]
name = "respan-instrumentation-pipecat"
version = "0.1.0"
description = "Respan instrumentation plugin for Pipecat"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_pipecat", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.16.1"
respan-sdk = ">=2.5.0"
pipecat-ai = ">=1.1.0"
openinference-instrumentation-pipecat = ">=1.0.2"
openinference-semantic-conventions = ">=0.1.28"
opentelemetry-semantic-conventions-ai = ">=0.4.1"

[tool.poetry.plugins."respan.instrumentations"]
pipecat = "respan_instrumentation_pipecat:PipecatInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
