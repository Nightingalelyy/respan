[tool.poetry]
name = "respan-instrumentation-smolagents"
version = "0.1.0"
description = "Respan instrumentation plugin for smolagents"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_smolagents", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.17.0"
respan-instrumentation-openinference = ">=1.2.2"
smolagents = { version = ">=1.24.0", extras = ["litellm"] }
openinference-instrumentation-smolagents = ">=0.1.29"

[tool.poetry.plugins."respan.instrumentations"]
smolagents = "respan_instrumentation_smolagents:SmolagentsInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
