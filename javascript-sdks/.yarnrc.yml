nodeLinker: node-modules
npmRegistryServer: "https://registry.npmjs.org"
# Allow lockfile creation/updates when using workspace from javascript-sdks
enableImmutableInstalls: false

# BeeAI 0.1.x imports Zod 3 APIs but omits Zod from its manifest. Declare the
# runtime edge so the workspace's Zod 4 consumers cannot be hoisted in its place.
packageExtensions:
  "beeai-framework@0.1.30":
    dependencies:
      zod: "^3.25.76"
